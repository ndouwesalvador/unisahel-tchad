name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    # A build-blocking corrupted commit and a stale-Prisma-client deploy both
    # reached production undetected earlier in this project's history because
    # nothing ran these checks before a push. This workflow runs the same
    # checks used locally, from a clean install, on every push/PR.
    env:
      # next build needs DATABASE_URL/DIRECT_URL to construct PrismaClient
      # and NEXTAUTH_SECRET to evaluate the auth config module, but the build
      # step itself never connects to the database - dummy values are enough.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      NEXTAUTH_SECRET: "ci-only-dummy-secret-not-used-anywhere-else-32ch"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (runs postinstall -> prisma generate)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

  e2e:
    runs-on: ubuntu-latest
    # A real login needs a real reachable database with seeded users. This job
    # used to point at the production Neon database (repo secrets), which made
    # it depend on whatever data happened to live there (it broke when that
    # data drifted from prisma/seed.ts) and wrote an AuditLog row to prod on
    # every run. Instead we stand up a throwaway Postgres, apply the committed
    # migrations, and seed it with prisma/seed.ts - fully deterministic and
    # isolated from production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: unisahel_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/unisahel_e2e"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/unisahel_e2e"
      NEXTAUTH_SECRET: "ci-only-dummy-secret-not-used-anywhere-else-32ch"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (runs postinstall -> prisma generate)
        run: npm ci

      - name: Apply migrations to the e2e database
        run: npx prisma migrate deploy

      - name: Seed the e2e database
        run: npx tsx prisma/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
