name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    # A build-blocking corrupted commit and a stale-Prisma-client deploy both
    # reached production undetected earlier in this project's history because
    # nothing ran these checks before a push. This workflow runs the same
    # checks used locally, from a clean install, on every push/PR.
    env:
      # next build needs DATABASE_URL/DIRECT_URL to construct PrismaClient
      # and NEXTAUTH_SECRET to evaluate the auth config module, but the build
      # step itself never connects to the database - dummy values are enough.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      NEXTAUTH_SECRET: "ci-only-dummy-secret-not-used-anywhere-else-32ch"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (runs postinstall -> prisma generate)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

  e2e:
    runs-on: ubuntu-latest
    # Unlike `verify` above, a real login requires a real reachable database
    # with real seeded users, so this job uses the actual Neon credentials
    # (repo secrets) instead of dummy ones. It runs against the real
    # database - login writes a real AuditLog row each run, same as any
    # real login would; nothing destructive.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (runs postinstall -> prisma generate)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
